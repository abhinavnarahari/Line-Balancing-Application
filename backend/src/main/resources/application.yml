spring:
  application:
    name: qtech-line-balancing

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qtech_linebalancing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Strict mode: never replay migrations onto a populated schema without history, never apply
    # lower-numbered migrations late, and stop on edited/deleted already-applied migrations.
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

server:
  port: ${PORT:8085}
  # Trust X-Forwarded-For from the nginx container (private network) so the real client IP is used
  # (login throttling, logs).
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: SEWNEXA_SESSION
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true once the site is served over HTTPS
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        # Only health is needed (Docker healthcheck); metrics/info would leak internals if reachable.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  flyway:
    # One-off: set FLYWAY_REPAIR_ON_START=true to realign migration history (see FlywayConfig)
    repair-on-start: ${FLYWAY_REPAIR_ON_START:false}
  admin:
    # First System Administrator, created only when no user accounts exist (see AdminBootstrap)
    email: ${APP_ADMIN_EMAIL:admin@sewnexa.local}
    password: ${APP_ADMIN_PASSWORD:}
  demo-data:
    # Re-creates today's sample attendance/production rows daily (demo deployments only)
    daily-refresh: ${DEMO_DATA_DAILY_REFRESH:false}

# Optional External LLM Integration (Zero configuration required by default)
llm:
  api-key: ${LLM_API_KEY:YOUR_LLM_API_KEY}
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
  model: ${LLM_MODEL:gemini-3.8-flash}

logging:
  level:
    com.qtech.linebalancing: ${LOGGING_LEVEL_APP:INFO}
    org.flywaydb: INFO
    org.springframework.web: INFO
