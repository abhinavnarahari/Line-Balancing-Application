spring:
  application:
    name: qtech-line-balancing

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qtech_linebalancing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true

server:
  port: ${PORT:8085}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Optional External LLM Integration (Zero configuration required by default)
llm:
  api-key: ${LLM_API_KEY:YOUR_LLM_API_KEY}
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
  model: ${LLM_MODEL:gemini-3.8-flash}

logging:
  level:
    com.qtech.linebalancing: ${LOGGING_LEVEL_APP:INFO}
    org.flywaydb: INFO
    org.springframework.web: INFO
